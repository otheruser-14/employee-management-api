name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: employee_management_test
          POSTGRES_USER: employee_ci_user
          POSTGRES_PASSWORD: ci_only_temporary_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U employee_ci_user -d employee_management_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      POSTGRES_DB: employee_management_test
      POSTGRES_USER: employee_ci_user
      POSTGRES_PASSWORD: ci_only_temporary_password
      JWT_SECRET: ci_only_temporary_signing_key_not_for_production_use_2026

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check .

      - name: Check formatting with Ruff
        run: ruff format --check .

      - name: Apply migrations and run PostgreSQL integration tests
        run: python tests/run_integration.py
