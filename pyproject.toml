[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "employee-management-api"
version = "0.1.0"
description = "Employee management API foundation"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2.0",
    "argon2-cffi>=23.1,<26.0",
    "email-validator>=2.2,<3.0",
    "fastapi>=0.115,<1.0",
    "PyJWT>=2.9,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<10.0",
    "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
