services:
  api:
    build: .
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in your environment or .env file}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in your environment or .env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment or .env file}
      JWT_SECRET: ${JWT_SECRET:-}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in your environment or .env file}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in your environment or .env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment or .env file}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  test:
    build:
      context: .
      target: test
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      POSTGRES_DB: employee_management_test
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in your environment or .env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment or .env file}
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "tests/run_integration.py"]

volumes:
  postgres_data:
